- name: Install packages with apt
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - fd-find
      - fzf
      - gcc
      - git
      - jq
      - lsd
      - make
      - neovim
      - pass
      - pass-extension-otp
      - ripgrep
      - stow
      - tmux
      - tree-sitter-cli
      - webext-browserpass
      - zsh
    state: present
  when: >
    ansible_distribution == "Ubuntu" or ansible_distribution == "Debian" or ansible_distribution == "Pop!_OS"

- name: Install packages with brew
  community.general.homebrew:
    name:
      - antidote
      - awscli
      - browserpass
      - fd
      - fzf
      - git
      - gnupg
      - gopass
      - helm
      - iperf3
      - jq
      - kubernetes-cli
      - lsd
      - mitmproxy
      - neovim
      - opencc
      - pass
      - pinentry-mac
      - ripgrep
      - starship
      - stow
      - tmux
    state: present
  when: ansible_distribution == "MacOSX"

- name: Install casks with brew
  community.general.homebrew_cask:
    name:
      - ghostty
      - squirrel
    state: present
  when: ansible_distribution == "MacOSX"
