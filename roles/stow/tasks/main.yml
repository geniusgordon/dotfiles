# --restow removes the stale links first, so a moved file does not leave one.
# The LINK: pattern also matches UNLINK:, so both count as a change.
- name: Run stow
  ansible.builtin.command:
    argv:
      - stow
      - --restow
      - --target={{ ansible_env.HOME }}
      - --verbose=2
      - stow
    chdir: "{{ playbook_dir }}"
  register: stow_result
  changed_when: 'stow_result.stderr is search("LINK: ")'
