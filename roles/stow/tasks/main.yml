# --restow removes the stale links first, so a moved file does not leave one.
# It relinks every file on each run, so the task cannot report a real change.
- name: Run stow
  ansible.builtin.command:
    argv:
      - stow
      - --restow
      - --target={{ ansible_env.HOME }}
      - --verbose=2
      - stow
    chdir: "{{ playbook_dir }}"
  changed_when: false
