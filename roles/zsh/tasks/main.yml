# .zshrc loads antidote from Homebrew first, then from ~/.antidote.
# Linux has no Homebrew antidote package, so clone the fallback path.
- name: Install antidote on Linux
  ansible.builtin.git:
    repo: https://github.com/mattmc3/antidote.git
    dest: "{{ ansible_env.HOME }}/.antidote"
    depth: 1
    version: main
  when: ansible_distribution != "MacOSX"
